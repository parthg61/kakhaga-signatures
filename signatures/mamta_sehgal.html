</div>

<script>
function copySignature() {
    const sigElement = document.getElementById('signature-content');
    
    // Create a range and select the element
    const range = document.createRange();
    range.selectNode(sigElement);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    
    try {
        // Execute copy command
        document.execCommand('copy');
        document.getElementById('success-msg').style.display = 'inline';
        setTimeout(() => {
            document.getElementById('success-msg').style.display = 'none';
        }, 3000);
    } catch (err) {
        alert('Could not copy automatically. Please select the preview manually and copy.');
    }
    
    // Clear selection
    selection.removeAllRanges();
}
</script>
